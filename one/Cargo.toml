[package]
name = "fwfd"
version = "1.0.12"
edition = "2021"
description = "fwf 1.0 supervisor: typed state, one event log, every authority-bearing write in one process"
license = "MIT"
publish = false

# 1.0 is the default: the binary is `fwf` (#583). The crate keeps its old name
# so `cargo build -p fwfd` and every release asset path still resolve.
[[bin]]
name = "fwf"
path = "src/main.rs"

# Temporary alias, one release only: scripts and operator notes that still say
# `fwfd` keep working. Remove both this target and the README's alias note next
# release.
[[bin]]
name = "fwfd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
jsonwebtoken = "11"
ureq = { version = "3", features = ["json"] }
unicode-width = "0.2.2"

[dev-dependencies]
tiny_http = "0.12"
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
