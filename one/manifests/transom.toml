# fwf 1.0 manifest for transom — overnight drain 2026-09-11 (Jamie: 6 product-wip bugs, opus impl).
repo = "tbaums/transom"
base_branch = "staging"
release_branch = "main"
gate_label = "product-wip"
owner_only = true
pairs = 1
session = "fwf-transom"
fast_suite = "fast"
promote_suite = "e2e"
gate_venue = "local"
gate_memory_gb = 8
gate_timeout_secs = 2400
job_timeout_secs = 2400
poll_interval_secs = 60
park_at_weekly_pct = 85
template = "dev"
triage_new = false
skip_labels = ["idea", "release-hold", "tracking", "needs-human", "discovery"]
issues = [1259, 1261, 1262, 1263, 1264, 1265]

[suites]
fast = "cargo test --workspace --quiet && cargo check -p frontend --target wasm32-unknown-unknown --quiet"
e2e = "cd tests/e2e && npm ci --silent && npx playwright test"

[models]
impl = "opus"
qa = "sonnet"
pm = "sonnet"
