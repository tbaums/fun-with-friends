name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # the reconcile guard files/closes its own tracking artifact

jobs:
  lint:
    name: shellcheck + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: bash -n (syntax)
        run: |
          for f in fwf *.sh lib/*.sh profiles/*.sh templates/*/template.sh eval/run.sh test/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done
      - name: shellcheck (fail on warnings + errors)
        run: shellcheck -s bash -S warning fwf *.sh lib/*.sh profiles/example.sh templates/*/template.sh eval/run.sh test/run.sh

  test:
    name: functional suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is NOT run here. GitHub-hosted macOS runners queue unpredictably
        # -- observed sitting unscheduled for 20+ minutes while the identical
        # build took 9 seconds on the operator's own Apple Silicon Mac -- and a
        # macOS job that never starts blocks every merge and every release
        # behind it. The BSD coverage is not dropped: it moved to
        # `scripts/mac-ci.sh`, run on real Darwin hardware by the operator, and
        # that is the oracle for any macOS-only ticket. See docs/macos-ci.md.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Show bash version
        run: bash --version | head -1
      - name: Run functional tests
        run: bash test/run.sh
      - name: "Run #156 memory-admission suite (issue #286 AC d)"
        # A SEPARATE step, not folded into test/run.sh: this suite forks real
        # process groups and includes several bounded but real sleeps (orphan
        # reap, gate-lock hand-off), so nesting its ~36 assertions inside
        # test/run.sh's own gate-wrapped runtime risks pushing a WRAPPED gate
        # invocation (fwf gate --cargo-build, which has its own max-run
        # reaper ceiling) past that ceiling on a slow runner -- observed
        # locally: nesting it caused the outer gate to be reaped as "wedged"
        # mid-suite. A dedicated CI step avoids that entirely while still
        # running on every push/PR, on both platforms (issue #286's Open
        # Question: this is what reads the real macOS free-RAM figure).
        run: bash test/mem-admit-test.sh

  dash:
    name: dash crate (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # issue #261: the shadow classifier needs a real
                             # merge-base, not a shallow (depth-1) tip.
      # issue #261 (#138 phase 2): fwf-gate-rust-scope.sh existed as a
      # dispatcher verb with NO real call site anywhere (no template, no
      # config, no CI step ever invoked it) -- so #138's own "every gate
      # accumulates the would-skip / would-run data" never happened, and
      # there was no log to read. The step at the end of this job (after
      # Test) is that call site: SHADOW MODE ONLY (its own exit code is
      # always 0, and this job runs the full suite unconditionally either
      # way) -- it exists to start accumulating the real would-skip/would-run
      # history, WITH timing, a future flip-or-drop decision needs, against
      # this repo's own actual layout. The safe-path list names everything
      # OUTSIDE dash/ this repo has today; deliberately NOT exhaustive -- an
      # unlisted path fails OPEN to a RUN verdict (see
      # fwf_gate_rust_scope_decide, lib.sh), so an incomplete list only
      # under-counts SKIP, it can never mis-classify a real dash/ change as
      # safe. .github/workflows/* is deliberately EXCLUDED from the safe
      # list -- a CI config change (including to this very job) should
      # classify as RUN, not SKIP.
      #
      # Persistence: GitHub Actions runners are ephemeral, so the log itself
      # is carried forward across runs via actions/cache's save-with-a-fresh-
      # key + restore-with-a-prefix idiom (restore-keys matches the most
      # recent previous run's key) -- a poor man's append-only counter that
      # needs no external storage.
      - name: "Restore #261 shadow-classifier log"
        uses: actions/cache/restore@v4
        with:
          path: .gate-rust-shadow.log
          key: gate-rust-shadow-${{ github.run_id }}
          restore-keys: |
            gate-rust-shadow-
      - name: Show toolchain
        working-directory: dash
        run: cargo --version && rustc --version
      - name: Format check
        working-directory: dash
        run: cargo fmt --check
      - name: Clippy (fail on warnings)
        working-directory: dash
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (release)
        working-directory: dash
        run: cargo build --release --locked
      # issue #261 AC(b): quantify the warm-cache always-on gate time the
      # A->B decision is compared against -- wall-clock the part #138
      # actually cares about (build+test, not fmt/clippy lint time), and
      # feed it back into the SAME log entry so the decision has both
      # numbers (would-skip rate AND time saved) in one place.
      - name: "Test (timed, feeds issue #261's measurement)"
        working-directory: dash
        run: |
          start="$(date +%s)"
          cargo test --locked
          secs="$(( $(date +%s) - start ))"
          against="${GITHUB_BASE_REF:+origin/$GITHUB_BASE_REF}"
          against="${against:-HEAD^}"
          bash ../fwf-gate-rust-scope.sh --against "$against" --log ../.gate-rust-shadow.log \
            --full-suite-secs "$secs" \
            --safe 'docs/*' --safe '*.md' --safe 'test/*' --safe 'templates/*' \
            --safe 'lib/*' --safe 'lib.sh' --safe 'fwf' --safe 'fwf-*.sh' \
            --safe 'config.sh' --safe 'profiles/*' --safe 'eval/*' --safe 'install.sh'
        env:
          # profiles/example.sh is the ONLY profile that lives in this repo;
          # 'fwf' is an installed, out-of-tree profile, so naming it here made
          # the classifier exit 1 on every runner ("unknown profile 'fwf'")
          # and turned the whole dash job red AFTER the tests had passed.
          FWF_PROFILE: example
          FWF_RUN_DIR: ${{ runner.temp }}/fwf-run
      - name: "Save #261 shadow-classifier log"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .gate-rust-shadow.log
          key: gate-rust-shadow-${{ github.run_id }}

  # --------------------------------------------------------------------------
  # Issue #179 Hole 1: the reconcile step lived ONLY in release.yml, which is
  # `on: push: tags`. An untagged direct-to-main push -- exactly what a hotfix
  # is -- never ran it, so the guard was structurally unreachable on the one
  # path that most needed it. ci.yml already fires on every push to main, so
  # this needs no new trigger.
  #
  # Hole 3: the verdict gets a DURABLE consequence here, not a log line.
  # `reconcile-guard` files one self-closing tracking issue and exits non-zero,
  # so this check goes red and stays red while the divergence stands. Do NOT
  # "simplify" this back to `./fwf reconcile || echo "::warning::..."` -- that
  # reproduces Hole 2 on the newly-added path and would still pass a test that
  # only asserts reconcile RAN.
  reconcile:
    name: reconcile staging/integration to main
    # Push-to-main only. Pull requests and workflow_dispatch must not mutate
    # shared branches or file artifacts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # the classifier needs real ancestry, not a shallow tip
      - name: Reconcile + file a durable artifact on divergence (issue #179)
        env:
          FWF_REPO: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./fwf reconcile-guard
