name: one CI

# fwf 1.0 lives under one/; its documentation lives at the repo root under
# docs/ (#609). Four short parallel jobs; target < 5 min total.
on:
  push:
    branches: [main, staging, 'one/**']
    paths: ['one/**', 'prompts/**', 'docs/**', 'scripts/link-check.sh', '.github/workflows/one-ci.yml']
  pull_request:
    paths: ['one/**', 'prompts/**', 'docs/**', 'scripts/link-check.sh', '.github/workflows/one-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: one

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: one
      - run: cargo test --quiet
      # #719: a binary must carry its prompts and scripts, not a path to this
      # checkout's copy of them (v1.0.26 baked /home/runner/work/…/prompts).
      - name: no checkout path baked into the binary
        run: |
          cargo build --quiet --bin fwf
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/debug/fwf "$RUNNER_TEMP/bin/fwf"
          scripts/baked-paths-check.sh "$RUNNER_TEMP/bin/fwf" "$GITHUB_WORKSPACE"
      # The same copy, run from / with a fresh HOME and the checkout's prompts/
      # renamed away: every job must still resolve, from $HOME/.fwf/prompts.
      - name: doctor --assets without the checkout's prompts
        run: |
          mv ../prompts ../prompts.moved-away
          home=$(mktemp -d)
          (cd / && HOME="$home" "$RUNNER_TEMP/bin/fwf" doctor --assets)
          for r in impl qa gv pm; do
            cmp "$home/.fwf/prompts/dev/$r-job.md" "../prompts.moved-away/dev/$r-job.md"
          done

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: one
      - run: cargo fmt --check
      - run: cargo clippy --quiet --all-targets -- -D warnings

  size:
    name: no file > 1000 lines
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/size-check.sh scripts/seat-up.sh scripts/seat-push-guard.sh scripts/release-publish.sh scripts/baked-paths-check.sh
      - run: scripts/size-check.sh

  links:
    name: docs links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # docs/ is at the repo root, not under one/, so this job opts out of the
    # workflow-level working-directory.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/link-check.sh
      - run: bash scripts/link-check.sh
