name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  # --------------------------------------------------------------------------
  # Cross-compile the dash binary for the supported os/arch matrix and upload
  # each as a release asset (issue #63), so `fwf dash` can download a prebuilt
  # binary instead of running `cargo build` on first use. Each target builds on
  # its native runner (no cross-linker), keeping the pure-Rust crate trivial.
  dash-binaries:
    name: dash binary (${{ matrix.slug }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: darwin-arm64,  runner: macos-14,         target: aarch64-apple-darwin }
          - { slug: linux-x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { slug: linux-arm64,   runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    defaults:
      run:
        working-directory: dash
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          [ "$tag" = "$file" ] || { echo "::error::tag v$tag != VERSION ($file)"; exit 1; }

      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build (release, locked)
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Stage asset
        working-directory: .
        run: |
          ver="$(cat VERSION)"
          asset="fwf-dash-${ver}-${{ matrix.slug }}"
          cp "dash/target/${{ matrix.target }}/release/fwf-dash" "$asset"
          # Per-asset checksum line; collected into one checksums file by the
          # release job. Use whichever sha256 tool the runner ships.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          cat "${asset}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash-${{ matrix.slug }}
          path: |
            fwf-dash-*-${{ matrix.slug }}
            fwf-dash-*-${{ matrix.slug }}.sha256
          if-no-files-found: error

  # --------------------------------------------------------------------------
  release:
    name: package + publish
    needs: dash-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION ($file) — bump VERSION before tagging"
            exit 1
          fi
          echo "tag and VERSION agree: $file"

      - name: Lint
        run: shellcheck -s bash -S warning fwf *.sh lib/*.sh profiles/example.sh templates/*/template.sh eval/run.sh test/run.sh

      - name: Functional tests
        run: bash test/run.sh

      - name: Build tarball
        id: pkg
        run: echo "path=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Download dash binaries
        uses: actions/download-artifact@v4
        with:
          pattern: dash-*
          path: dash-assets
          merge-multiple: true

      - name: Assemble checksums file
        run: |
          ver="$(cat VERSION)"
          sums="fwf-dash-${ver}-checksums.txt"
          # Collapse the per-arch *.sha256 lines into one published checksums
          # file (the same name the resolver in fwf-dash.sh looks for).
          cat dash-assets/*.sha256 > "dash-assets/$sums"
          echo "----- $sums -----"
          cat "dash-assets/$sums"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(cat VERSION)"
          # Collect the dash assets to attach: the per-arch binaries plus the
          # combined checksums file (everything under dash-assets/ that ISN'T a
          # per-arch *.sha256 line). Gather into an array so paths are passed as
          # distinct argv entries, rather than interpolating a multiline workflow
          # output into the command (that splits across shell lines and mis-runs
          # the paths as commands).
          assets=()
          while IFS= read -r f; do assets+=("$f"); done \
            < <(ls dash-assets/fwf-dash-"$ver"-* | grep -v '\.sha256$')
          echo "attaching ${#assets[@]} dash assets: ${assets[*]}"
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.path }}" \
            "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
