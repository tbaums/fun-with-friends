name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  # --------------------------------------------------------------------------
  # Issue #179 Hole 2: PRE-PUBLISH divergence gate.
  #
  # The post-publish reconcile below swallows its own failure into a
  # `::warning::` for a real reason -- the release already published, and
  # failing it retroactively helps nobody. But that constraint only binds
  # AFTER the publish. So the CHECK moves in front of it, where nothing has
  # shipped yet and failing is free.
  #
  # `--check` classifies and NEVER mutates: it takes no lock, fast-forwards
  # nothing, pushes nothing. It fails ONLY on DIVERGED/SUSPECT -- a BEHIND
  # branch is merely stale, the post-publish reconcile fast-forwards it, and
  # blocking a release for that would be wrong.
  #
  # Every publishing job hangs off this one, so a genuine divergence stops the
  # release before a single artifact exists.
  preflight:
    name: pre-publish divergence check
    runs-on: local-devbox   # operator directive: no GitHub-hosted CI; all CI runs on our own boxes
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # the classifier needs real ancestry, not a shallow tip
      - name: Refuse to publish onto a diverged base (issue #179)
        env:
          FWF_REPO: ${{ github.workspace }}
        run: |
          set -o pipefail
          if ! out="$(./fwf reconcile --check 2>&1)"; then
            printf '%s\n' "$out"
            {
              echo "## Release blocked: diverged base"
              echo
              echo '```'
              printf '%s\n' "$out"
              echo '```'
              echo
              echo "Nothing was published — this ran before any artifact was built."
              echo
              echo "A \`check-diverged\` branch is **not** stale. It has commits \`main\` does not,"
              echo "and \`main\` has commits it does not. \`fwf reconcile\` will never auto-merge,"
              echo "rebase or force-push out of that state, by design."
              echo
              echo "**This needs a human decision, not a rerun.** Re-read the classification with:"
              echo
              echo '```sh'
              echo "fwf reconcile --branch <branch> --against main"
              echo '```'
              echo
              echo "Reconcile the branch by hand, then re-tag."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s\n' "$out"

  # --------------------------------------------------------------------------
  # Issue #303: release.yml's own checks (shellcheck + a single ubuntu
  # functional pass, below) were a STRICT SUBSET of what ci.yml actually
  # runs -- red on macOS or in the Rust crate was invisible here, and three
  # consecutive releases (v0.33.0/v0.34.0/v0.35.0) published over a red
  # `dash crate (rust)` as a direct result. Rather than widen this job's own
  # checks (recreating the drift in a new place, per this ticket's explicit
  # "do not add a macOS/cargo job here"), this job CONSULTS ci.yml's own
  # verdict for this exact SHA via GitHub's check-runs API, reading the
  # required-context list from the SAME committed source of truth
  # fwf-branch-policy.sh diffs live branch protection against
  # (.github/branch-policy.json) -- one list, not two that can drift apart.
  #
  # Every publishing job hangs off this one too (see preflight's own
  # comment) -- a red or never-reported required context stops the release
  # before a single artifact exists.
  ci-verdict:
    name: required CI checks are green for this SHA
    runs-on: local-devbox   # operator directive: no GitHub-hosted CI; all CI runs on our own boxes
    steps:
      - uses: actions/checkout@v5
      - name: Consult ci.yml's verdict for this SHA (issue #303)
        env:
          FWF_REPO: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # LOCAL-CI ERA (operator direction 2026-08-29): ci.yml is DISABLED --
          # all CI now runs on the factory box (fwf-local-ci.sh), whose verdicts
          # live on that box and are not reachable from a GitHub runner. With
          # ci.yml off, every required context is permanently "absent", and #303
          # correctly refuses an absent context exactly like a failing one --
          # which would block EVERY release forever.
          #
          # So when ci.yml is disabled this gate degrades to ADVISORY and the
          # real gate moves off-workflow: the operator must have a two-runner
          # local green (macOS + devbox, each with DONE + EXIT= + a
          # "passed, N failed" summary) for this exact SHA BEFORE pushing the
          # tag. See RELEASING.md.
          #
          # If ci.yml is ever re-enabled, this reverts to blocking automatically
          # -- the contexts start reporting again and the `if !` below bites.
          CI_STATE="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml" --jq .state 2>/dev/null || echo unknown)"
          if [ "$CI_STATE" != "active" ]; then
            echo "::warning::ci.yml is '$CI_STATE' -- CI runs on the factory box now."
            echo "::warning::This gate is ADVISORY for this release. The blocking gate is the"
            echo "::warning::operator's two-runner local green for ${{ github.sha }} before tagging."
            ./fwf-release-ci-gate.sh "${{ github.sha }}" 2>&1 | tee /tmp/ci-verdict.log || true
            exit 0
          fi
          if ! ./fwf-release-ci-gate.sh "${{ github.sha }}" 2>&1 | tee /tmp/ci-verdict.log; then
            {
              echo "## Release blocked: required CI checks are not green for this SHA"
              echo
              echo '```'
              cat /tmp/ci-verdict.log
              echo '```'
              echo
              echo "Nothing was published — this ran before any artifact was built."
              echo
              echo "A required context that never reported is refused exactly like a"
              echo "failing one (issue #303 AC b) — check whether it was renamed without"
              echo "updating \`.github/branch-policy.json\` in the same commit, or is"
              echo "still genuinely running (re-tag once it completes)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # Issue #209 AC (d)/(d2)/(j): the dash-binaries matrix and
  # scripts/assert-release-assets.sh's expected asset set both derive from
  # ONE declared source of truth (dash-targets.json), never from each other
  # and never from what a build leg actually produced -- deriving the
  # expectation from the run's own outputs is what makes a check
  # tautological (a skipped leg drops its own expectation too, so the check
  # passes on exactly the failure it exists to catch). This job's only job
  # is to turn that file into a matrix `fromJSON` can consume; nothing here
  # or below may name a target slug or runner label directly.
  load-targets:
    name: load dash-targets.json
    needs: [preflight, ci-verdict]
    runs-on: local-devbox   # operator directive: no GitHub-hosted CI; all CI runs on our own boxes
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: load
        run: echo "matrix=$(jq -c '.targets' dash-targets.json)" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Cross-compile the dash binary for the supported os/arch matrix and upload
  # each as a release asset (issue #63), so `fwf dash` can download a prebuilt
  # binary instead of running `cargo build` on first use. Each target builds on
  # its native runner (no cross-linker), keeping the pure-Rust crate trivial.
  dash-binaries:
    name: dash binary (${{ matrix.slug }})
    needs: [preflight, ci-verdict, load-targets]     # issue #179: no artifact is built onto a diverged base
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-targets.outputs.matrix) }}
    defaults:
      run:
        working-directory: dash
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          [ "$tag" = "$file" ] || { echo "::error::tag v$tag != VERSION ($file)"; exit 1; }

      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build (release, locked)
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Stage asset
        working-directory: .
        run: |
          ver="$(cat VERSION)"
          asset="fwf-dash-${ver}-${{ matrix.slug }}"
          cp "dash/target/${{ matrix.target }}/release/fwf-dash" "$asset"
          # Per-asset checksum line; collected into one checksums file by the
          # release job. Use whichever sha256 tool the runner ships.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          cat "${asset}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash-${{ matrix.slug }}
          path: |
            fwf-dash-*-${{ matrix.slug }}
            fwf-dash-*-${{ matrix.slug }}.sha256
          if-no-files-found: error

  # --------------------------------------------------------------------------
  release:
    name: package + publish
    needs: [preflight, ci-verdict, dash-binaries]
    runs-on: local-devbox   # operator directive: no GitHub-hosted CI; all CI runs on our own boxes
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history: the reconcile step's ancestry checks need it

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION ($file) — bump VERSION before tagging"
            exit 1
          fi
          echo "tag and VERSION agree: $file"

      - name: Lint
        run: shellcheck -s bash -S warning fwf *.sh lib/*.sh profiles/example.sh templates/*/template.sh eval/run.sh test/run.sh

      # TESTS DO NOT RUN ON GITHUB ANY MORE (operator direction 2026-08-29).
      # This job used to re-run the whole ~2500-test suite plus the
      # memory-admission suite here, on a SHA that had ALREADY been tested.
      # GitHub evicted that step four times across v0.37.0, v0.38.0 and two
      # v0.39.0 attempts -- "The runner has received a shutdown signal", zero
      # FAIL lines, suite never finished. Every one of those was a lost release
      # for reasons that had nothing to do with the code.
      #
      # The gate did not disappear, it moved off GitHub:
      #   * ci.yml is disabled; all CI runs on the factory box
      #     (fwf-local-ci.sh), which records a per-SHA verdict.
      #   * RELEASING.md requires a TWO-RUNNER local green (macOS + devbox) for
      #     the exact SHA being tagged, each log carrying DONE, EXIT= and a
      #     "passed, N failed" summary, BEFORE the tag is pushed.
      #   * The #303 job above still consults ci.yml's verdict for this SHA and
      #     re-arms to blocking automatically if ci.yml is ever re-enabled.
      #
      # What stays here is PACKAGING, not testing: tarball, dash binaries,
      # checksums, and the asset assertion that proves the published set is
      # exactly what dash-targets.json says it should be.

      - name: Build tarball
        id: pkg
        run: echo "path=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Download dash binaries
        uses: actions/download-artifact@v4
        with:
          pattern: dash-*
          path: dash-assets
          merge-multiple: true

      - name: Assemble checksums file
        run: |
          ver="$(cat VERSION)"
          sums="fwf-dash-${ver}-checksums.txt"
          # Collapse the per-arch *.sha256 lines into one published checksums
          # file (the same name the resolver in fwf-dash.sh looks for).
          cat dash-assets/*.sha256 > "dash-assets/$sums"
          echo "----- $sums -----"
          cat "dash-assets/$sums"

      - name: Create GitHub Release (DRAFT — issue #209)
        # Draft -> upload -> assert -> publish, not publish -> assert. The
        # v0.27.4 failure was a release that was ALREADY PUBLIC with assets
        # missing; asserting after publish only turns that into a red check
        # on an incomplete release the operator now has to un-ship. As a
        # draft, a failed assertion below means NOTHING was ever published --
        # recovery is fix-and-rerun, not a runbook for undoing a live release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(cat VERSION)"
          # Collect the dash assets to attach: the per-arch binaries plus the
          # combined checksums file (everything under dash-assets/ that ISN'T a
          # per-arch *.sha256 line). Gather into an array so paths are passed as
          # distinct argv entries, rather than interpolating a multiline workflow
          # output into the command (that splits across shell lines and mis-runs
          # the paths as commands).
          assets=()
          while IFS= read -r f; do assets+=("$f"); done \
            < <(ls dash-assets/fwf-dash-"$ver"-* | grep -v '\.sha256$')
          echo "attaching ${#assets[@]} dash assets: ${assets[*]}"
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.path }}" \
            "${assets[@]}" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Assert published asset set (issue #209)
        # Reads GitHub's own view of the DRAFT's assets (never a local file
        # listing — an upload that silently landed nowhere, the v0.27.4
        # shape, is exactly what a local check would miss) against
        # dash-targets.json, the single declared source of truth. A mismatch
        # fails this job with nothing ever published (see the draft note
        # above) -- fix and re-run, not a runbook for an already-public
        # release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(cat VERSION)"
          scripts/assert-release-assets.sh "$ver"

      - name: Publish release (issue #209)
        # Only reached if the assertion above passed. Flipping draft=false is
        # the one and only publish action in this workflow.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Reconcile staging/integration to main (issues #114, #179)
        env:
          FWF_REPO: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # POST-publish, so this must not fail the release retroactively --
          # the artifacts are already out. It fast-forwards staging/integration
          # when they're merely stale, and no-ops a branch that legitimately
          # leads main.
          #
          # Issue #179: what it must NOT do is drop the leftover case on the
          # floor. The pre-publish `preflight` job already refused to publish
          # onto a genuinely diverged base, so reaching this line in a diverged
          # state means something moved DURING the release -- rare, and exactly
          # the case a `::warning::` inside a green run would bury. Route it to
          # the same durable, self-closing artifact ci.yml uses, then keep the
          # release green.
          #
          # Issue #238: reconcile-guard now also exits 2 for an INDETERMINATE
          # verdict (lock-busy/cas-lost -- a lost race against a concurrent,
          # benign writer, not a divergence), which files no artifact at all.
          # Claiming "a tracking issue has been filed" on that exit code would
          # be false, so the warning is worded from the exit code, not assumed.
          rc=0; ./fwf reconcile-guard || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::post-publish reconcile hit a transient, self-healing race (lock-busy/cas-lost) — no tracking issue filed, next run re-classifies; the release itself succeeded"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::post-publish reconcile needs a human — a tracking issue has been filed; the release itself succeeded"
          fi
